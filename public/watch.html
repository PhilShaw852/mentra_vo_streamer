<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch stream – Mentra Live</title>
  <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1rem;
      background: #0f0f12;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    .video-wrap {
      width: 100%;
      max-width: 720px;
      background: #000;
      border-radius: 0.5rem;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .video-wrap video { width: 100%; height: 100%; display: block; }
    .status {
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #a1a1aa;
    }
    .status.error { color: #fca5a5; }
    .controls {
      margin-top: 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      background: #3f3f46;
      color: #e4e4e7;
    }
    button:hover { background: #52525b; }
    button.record {
      background: #dc2626;
      color: white;
    }
    button.record:hover { background: #b91c1c; }
    button.recording {
      background: #b91c1c;
      color: white;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.85; } }
    a { color: #818cf8; }
  </style>
</head>
<body>
  <h1>Live stream</h1>
  <div class="video-wrap">
    <video id="video" controls muted playsinline></video>
  </div>
  <div class="controls">
    <button type="button" id="recordBtn" class="record">Record</button>
    <span class="status" id="recordStatus"></span>
  </div>
  <p class="status" id="status">Loading…</p>
  <p class="status" style="font-size: 0.75rem; margin-top: 0.25rem;">Recordings save to <strong>recordings/</strong> in the project folder. FLV is always saved; an MP4 is also created if <code>ffmpeg</code> is installed (e.g. <code>brew install ffmpeg</code>).</p>
  <p><a href="/">Back to stream setup</a></p>

  <script>
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const recordBtn = document.getElementById('recordBtn');
    const recordStatusEl = document.getElementById('recordStatus');

    let recording = false;

    function shortPath(fullPath) {
      if (!fullPath) return '';
      const m = fullPath.match(/recordings\/[^/]+$/);
      return m ? m[0] : fullPath.split(/[/\\]/).slice(-2).join('/');
    }

    async function updateRecordStatus() {
      try {
        const st = await fetch('/api/record/status').then(r => r.json());
        recording = st.recording;
        if (st.recording && st.path) recordStatusEl.textContent = 'Recording to ' + shortPath(st.path);
      } catch (_) {}
    }

    recordBtn.addEventListener('click', async () => {
      if (recording) {
        try {
          const res = await fetch('/api/record/stop', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          recording = false;
          recordBtn.textContent = 'Record';
          recordBtn.classList.remove('recording');
          recordStatusEl.textContent = data.path ? 'Saved to ' + shortPath(data.path) : 'Stopped';
        } catch (err) {
          recordStatusEl.textContent = 'Stop failed';
        }
      } else {
        recordStatusEl.textContent = 'Starting…';
        recordBtn.disabled = true;
        try {
          const res = await fetch('/api/record/start', { method: 'POST' });
          const data = await res.json().catch(() => ({}));
          if (res.ok && data.ok) {
            recording = true;
            recordBtn.textContent = 'Stop recording';
            recordBtn.classList.add('recording');
            recordStatusEl.textContent = 'Recording to ' + (data.filename || shortPath(data.path) || 'recordings/');
          } else {
            recordStatusEl.textContent = data.error || 'Failed to start recording';
          }
        } catch (err) {
          recordStatusEl.textContent = 'Request failed';
        }
        recordBtn.disabled = false;
      }
    });

    async function play() {
      const res = await fetch('/api/receiver-info');
      const info = await res.json();
      const url = info.playbackUrl;
      if (!url) {
        statusEl.textContent = 'No playback URL.';
        statusEl.classList.add('error');
        return;
      }
      if (!flvjs.isSupported()) {
        statusEl.textContent = 'FLV playback not supported in this browser.';
        statusEl.classList.add('error');
        return;
      }
      const flvPlayer = flvjs.createPlayer({
        type: 'flv',
        url: url,
        isLive: true,
        hasAudio: true,
        hasVideo: true,
      }, { enableStashBuffer: false, stashInitialSize: 128 });
      flvPlayer.attachMediaElement(video);
      flvPlayer.load();
      flvPlayer.play();
      flvPlayer.on(flvjs.Events.ERROR, () => {
        statusEl.textContent = 'Stream not available. Start the stream from the glasses first.';
        statusEl.classList.add('error');
      });
      flvPlayer.on(flvjs.Events.LOADING_COMPLETE, () => {
        statusEl.textContent = 'Live';
        statusEl.classList.remove('error');
      });
      statusEl.textContent = 'Connecting…';
      setInterval(updateRecordStatus, 2000);
    }
    play();
  </script>
</body>
</html>
